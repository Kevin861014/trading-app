<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>順勢策略分析</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0f1117;--bg2:#1a1d27;--bg3:#22263a;
  --border:rgba(255,255,255,0.08);
  --text:#e8eaf0;--text2:#8b90a0;--text3:#555a6e;
  --green:#26a69a;--red:#ef5350;--blue:#378ADD;--r:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.header{padding:14px 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.header h1{font-size:16px;font-weight:600;}
.add-bar{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.add-bar input{flex:1;min-width:140px;font-size:13px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--text);}
.add-bar input:focus{outline:none;border-color:var(--blue);}
.add-bar input::placeholder{color:var(--text3);}
.add-bar select{font-size:12px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg2);color:var(--text);}
.add-bar select:focus{outline:none;border-color:var(--blue);}
.btn-add{font-size:13px;padding:8px 16px;border-radius:8px;background:var(--blue);color:#fff;border:none;cursor:pointer;font-weight:500;}
.btn-add:hover{opacity:0.85;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:14px 16px;}
@media(max-width:680px){.grid{grid-template-columns:1fr;gap:12px;padding:12px;}}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
.card-top{padding:12px 14px 10px;display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
.card-name{font-size:15px;font-weight:600;margin-bottom:2px;}
.card-sub{font-size:11px;color:var(--text2);}
.card-actions{display:flex;align-items:center;gap:5px;flex-shrink:0;}
.btn-icon{font-size:12px;background:none;border:1px solid var(--border);border-radius:6px;color:var(--text2);cursor:pointer;padding:5px 8px;line-height:1;}
.btn-icon:hover{color:var(--text);border-color:rgba(255,255,255,0.2);}
.btn-icon.del:hover{color:var(--red);border-color:var(--red);}
.signal-banner{padding:8px 14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;}
.signal-big{font-size:14px;font-weight:700;}
.signal-big.buy{color:var(--green);}
.signal-big.sell{color:var(--red);}
.signal-big.hold{color:var(--text2);}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);}
.metric{background:var(--bg2);padding:8px 10px;text-align:center;}
.metric-label{font-size:10px;color:var(--text2);margin-bottom:2px;text-transform:uppercase;}
.metric-val{font-size:14px;font-weight:600;}
.up{color:var(--green);}.down{color:var(--red);}.neutral{color:var(--text);}
.card-status{padding:7px 14px;font-size:11px;color:var(--text2);border-top:1px solid var(--border);display:flex;align-items:center;gap:6px;min-height:30px;}
.chart-section{border-top:1px solid var(--border);padding:10px 14px 14px;}
.toolbar{display:flex;gap:5px;margin-bottom:8px;flex-wrap:wrap;align-items:center;}
.sel-sm{font-size:11px;padding:4px 7px;border:1px solid var(--border);border-radius:6px;background:var(--bg3);color:var(--text);cursor:pointer;}
.sel-sm:focus{outline:none;border-color:var(--blue);}
/* 指標開關 */
.ind-toggles{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.itoggle{font-size:10px;padding:3px 8px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all 0.15s;}
.itoggle.on{background:var(--bg3);color:var(--text);border-color:rgba(255,255,255,0.2);}
/* 圖表容器 */
.chart-container{border-radius:8px;overflow:hidden;background:#0f1117;}
.chart-pane{width:100%;}
.chart-pane-label{font-size:10px;color:var(--text2);padding:3px 8px;background:rgba(0,0,0,0.3);}
.trades-section{margin-top:10px;}
.trades-title{font-size:10px;color:var(--text2);text-transform:uppercase;margin-bottom:5px;}
.tm-row{font-size:12px;padding:5px 0;border-bottom:1px solid var(--border);color:var(--text2);}
.tm-row:last-child{border-bottom:none;}
.spinner{width:11px;height:11px;border:2px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}
/* Modal */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.88);z-index:1000;align-items:center;justify-content:center;padding:16px;}
.modal-bg.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);width:100%;max-width:1200px;max-height:93vh;overflow:auto;padding:18px;}
.modal-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.modal-title{font-size:15px;font-weight:600;}
.modal-signal{font-size:13px;font-weight:600;margin-top:3px;}
.modal-toolbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.btn-close{font-size:18px;background:none;border:none;color:var(--text2);cursor:pointer;padding:4px;}
.btn-close:hover{color:var(--text);}
.modal-ind-toggles{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
.note{font-size:10px;color:var(--text3);padding:8px 16px 16px;text-align:center;}
</style>
</head>
<body>

<div class="header">
  <h1>📈 順勢策略分析</h1>
  <span style="font-size:11px;color:var(--text2);">台股1D · 加密4H</span>
</div>

<div class="add-bar">
  <input id="addInput" placeholder="代碼：2330.TW / AAPL / PAXG-USD" onkeydown="if(event.key==='Enter')addStock()">
  <select id="addStrat"></select>
  <button class="btn-add" onclick="addStock()">＋ 加入</button>
</div>

<div class="grid" id="grid"></div>
<p class="note">資料來源：Yahoo Finance｜台股含0.45%成本｜加密含0.24%｜過去績效不代表未來</p>

<!-- 放大 Modal -->
<div class="modal-bg" id="modalBg" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modalTitle">K 線圖</div>
        <div class="modal-signal" id="modalSignal"></div>
      </div>
      <div class="modal-toolbar">
        <select class="sel-sm" id="modalPeriod" onchange="reloadModal()">
          <option value="7d">7天</option><option value="1mo">1月</option>
          <option value="1y" selected>1年</option><option value="2y">2年</option>
          <option value="3y">3年</option><option value="5y">5年</option>
        </select>
        <select class="sel-sm" id="modalTf" onchange="reloadModal()">
          <option value="1d">日線1D</option>
          <option value="4h">4小時4H</option>
          <option value="1h">1小時1H</option>
        </select>
        <button class="btn-close" onclick="closeModal()">✕</button>
      </div>
    </div>
    <div class="modal-ind-toggles" id="modalIndToggles"></div>
    <div id="modalChartContainer" style="border-radius:8px;overflow:hidden;"></div>
  </div>
</div>

<script>
// ── 常數 ──────────────────────────────────────────────
const PERIODS=['7d','1mo','1y','2y','3y','5y'];
const PERIOD_LABELS={'7d':'7天','1mo':'1月','1y':'1年','2y':'2年','3y':'3年','5y':'5年'};
const TFS=['1d','4h','1h'];
const TF_LABELS={'1d':'日線','4h':'4H','1h':'1H'};
const CHART_OPTS={
  layout:{background:{color:'#0f1117'},textColor:'#8b90a0'},
  grid:{vertLines:{color:'rgba(255,255,255,0.04)'},horzLines:{color:'rgba(255,255,255,0.04)'}},
  crosshair:{mode:1},
  rightPriceScale:{borderColor:'rgba(255,255,255,0.1)'},
  timeScale:{borderColor:'rgba(255,255,255,0.1)',timeVisible:true},
  handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:false},
  handleScale:{mouseWheel:true,pinch:true,axisPressedMouseMove:true},
};

function defaultTf(symbol){
  return ['BTC','ETH','BNB','SOL','XRP','DOGE','PAXG','LINK','LTC','TRX','ADA','USD'].some(c=>symbol.toUpperCase().includes(c))?'4h':'1d';
}

// ── 計算指標 ──────────────────────────────────────────
function calcKD(prices,n=9){
  const K=[],D=[];let prevK=50,prevD=50;
  for(let i=0;i<prices.length;i++){
    const s=prices.slice(Math.max(0,i-n+1),i+1);
    const hi=Math.max(...s),lo=Math.min(...s);
    const rsv=hi===lo?50:(prices[i]-lo)/(hi-lo)*100;
    const k=prevK*(2/3)+rsv*(1/3),d=prevD*(2/3)+k*(1/3);
    K.push(parseFloat(k.toFixed(2)));D.push(parseFloat(d.toFixed(2)));
    prevK=k;prevD=d;
  }
  return{K,D};
}

function calcRSI(prices,n=14){
  const out=new Array(prices.length).fill(null);
  let ag=0,al=0;
  for(let i=1;i<prices.length;i++){
    const ch=prices[i]-prices[i-1],up=Math.max(ch,0),dn=Math.max(-ch,0);
    if(i<n){ag+=up/n;al+=dn/n;continue;}
    ag=(ag*(n-1)+up)/n;al=(al*(n-1)+dn)/n;
    out[i]=al>0?parseFloat((100-100/(1+ag/al)).toFixed(2)):100;
  }
  return out;
}

function calcEMADiff(ema20,ema50){
  return ema20.map((v,i)=>(v&&ema50[i]&&ema50[i]>0)?parseFloat(((v-ema50[i])/ema50[i]*100).toFixed(3)):0);
}

// ── 狀態 ──────────────────────────────────────────────
let strategies=[];
let stocks=JSON.parse(localStorage.getItem('stocks_v5')||'null')||[
  {id:1,symbol:'2330.TW',name:'台積電 2330',strat:'diadx',period:'2y',tf:'1d',indicators:{ema:true,kd:true,rsi:true,vol:true}},
  {id:2,symbol:'2317.TW',name:'鴻海 2317',strat:'diadx',period:'2y',tf:'1d',indicators:{ema:true,kd:true,rsi:true,vol:true}},
  {id:3,symbol:'2603.TW',name:'長榮 2603',strat:'diadx',period:'2y',tf:'1d',indicators:{ema:true,kd:true,rsi:true,vol:true}},
  {id:4,symbol:'0050.TW',name:'0050',strat:'sixline',period:'2y',tf:'1d',indicators:{ema:true,kd:true,rsi:true,vol:true}},
  {id:5,symbol:'PAXG-USD',name:'PAXG 黃金幣',strat:'supertrend',period:'2y',tf:'1d',indicators:{ema:true,kd:true,rsi:true,vol:true}},
  {id:6,symbol:'SOL-USD',name:'SOL',strat:'keltner',period:'2y',tf:'4h',indicators:{ema:true,kd:true,rsi:true,vol:true}},
  {id:7,symbol:'ETH-USD',name:'ETH',strat:'ttm',period:'2y',tf:'4h',indicators:{ema:true,kd:true,rsi:true,vol:true}},
];
let nextId=Math.max(...stocks.map(s=>s.id),0)+1;
let chartInsts={};
let modalChartInst=null;
let modalStockId=null;
let modalData=null;
let modalIndicators={ema:true,kd:true,rsi:true,vol:true};

const NAME_MAP={
  '2330.TW':'台積電 2330','2317.TW':'鴻海 2317','2603.TW':'長榮 2603',
  '2454.TW':'聯發科 2454','0050.TW':'0050','2308.TW':'台達電 2308',
  '3711.TW':'日月光 3711','2382.TW':'廣達 2382','3008.TW':'大立光 3008',
  '2891.TW':'中信金 2891','2412.TW':'中華電 2412',
  'AAPL':'Apple','MSFT':'Microsoft','NVDA':'NVIDIA','GOOGL':'Google',
  'AMZN':'Amazon','META':'Meta','TSLA':'Tesla','AMD':'AMD',
  'BTC-USD':'Bitcoin BTC','ETH-USD':'Ethereum ETH','BNB-USD':'BNB',
  'SOL-USD':'Solana SOL','XRP-USD':'XRP','PAXG-USD':'PAXG 黃金幣',
  'DOGE-USD':'Dogecoin','LINK-USD':'Chainlink',
};
function autoName(s){return NAME_MAP[s]||NAME_MAP[s.toUpperCase()]||s;}
function save(){localStorage.setItem('stocks_v5',JSON.stringify(stocks));}

// ── 策略載入 ──────────────────────────────────────────
async function loadStrategies(){
  try{const r=await fetch('/api/strategies');strategies=await r.json();}
  catch(e){strategies=[
    {v:'sixline',l:'六條線（最推薦）'},{v:'diadx',l:'DMI/ADX（台股最強）'},
    {v:'supertrend',l:'Supertrend'},{v:'keltner',l:'Keltner 突破'},
    {v:'volbreak',l:'波動突破'},{v:'ttm',l:'TTM 擠壓'},
    {v:'ema_cross',l:'EMA 快慢交叉'},{v:'donchian',l:'Donchian 突破'},
    {v:'trend',l:'順勢 EMA'},{v:'rsi',l:'RSI 逆勢'},
  ];}
  document.getElementById('addStrat').innerHTML=strategies.map(s=>`<option value="${s.v}">${s.l}</option>`).join('');
}
function getStratName(v){const s=strategies.find(s=>s.v===v);return s?s.l.split('（')[0].split('(')[0]:v;}

// ── 新增/刪除 ──────────────────────────────────────────
function addStock(){
  const input=document.getElementById('addInput');
  const raw=input.value.trim().toUpperCase();
  if(!raw) return;
  const symbol=/^\d{4}$/.test(raw)?raw+'.TW':raw;
  const strat=document.getElementById('addStrat').value||'diadx';
  const id=nextId++;
  const stock={id,symbol,name:autoName(symbol),strat,period:'2y',tf:defaultTf(symbol),
    indicators:{ema:true,kd:true,rsi:true,vol:true}};
  stocks.push(stock);save();
  input.value='';
  renderCard(stock);
  loadCard(id);
}

function deleteStock(id,e){
  e.stopPropagation();
  if(!confirm('確定刪除？')) return;
  stocks=stocks.filter(s=>s.id!==id);save();
  destroyCard(id);
  document.getElementById(`card-${id}`)?.remove();
}

function destroyCard(id){
  if(chartInsts[id]){
    chartInsts[id].forEach(c=>{try{c.remove();}catch(e){}});
    delete chartInsts[id];
  }
}

// ── 設定變更 ──────────────────────────────────────────
function changeStrat(id,val){const s=stocks.find(s=>s.id===id);if(s){s.strat=val;save();}reloadCard(id);}
function changePeriod(id,val){const s=stocks.find(s=>s.id===id);if(s){s.period=val;save();}reloadCard(id);}
function changeTf(id,val){const s=stocks.find(s=>s.id===id);if(s){s.tf=val;save();}reloadCard(id);}

function toggleIndicator(id,ind){
  const s=stocks.find(s=>s.id===id);
  if(!s) return;
  s.indicators[ind]=!s.indicators[ind];save();
  const btn=document.getElementById(`itoggle-${id}-${ind}`);
  if(btn) btn.classList.toggle('on',s.indicators[ind]);
  const card=document.getElementById(`card-${id}`);
  if(card&&card.dataset.loaded==='1'){
    const data=JSON.parse(card.dataset.chartdata||'null');
    if(data) drawCharts(id,data,s.indicators);
  }
}

function toggleModalIndicator(ind){
  modalIndicators[ind]=!modalIndicators[ind];
  const btn=document.getElementById(`modal-itoggle-${ind}`);
  if(btn) btn.classList.toggle('on',modalIndicators[ind]);
  if(modalData) drawModalCharts(modalData,modalIndicators);
}

function reloadCard(id){
  destroyCard(id);
  const card=document.getElementById(`card-${id}`);
  if(card) card.dataset.loaded='0';
  loadCard(id);
}

// ── 載入資料 ──────────────────────────────────────────
async function loadCard(id){
  const stock=stocks.find(s=>s.id===id);
  if(!stock) return;
  const card=document.getElementById(`card-${id}`);
  if(!card) return;
  card.querySelector('.card-status').innerHTML=`<span class="spinner"></span> 載入中...`;
  card.querySelector('.signal-banner').innerHTML='<span class="signal-big hold">— 載入中</span>';
  setMetrics(card,null);
  card.dataset.loaded='0';
  try{
    const r=await fetch(`/api/analyze?symbol=${stock.symbol}&strategy=${stock.strat}&period=${stock.period||'2y'}&timeframe=${stock.tf||'1d'}`);
    const data=await r.json();
    if(data.error){
      card.querySelector('.card-status').innerHTML=`<span style="color:var(--red);">⚠ ${data.error}</span>`;
      card.querySelector('.signal-banner').innerHTML='<span class="signal-big hold">— 載入失敗</span>';
      return;
    }
    card.dataset.loaded='1';
    card.dataset.chartdata=JSON.stringify(data);
    setMetrics(card,data.metrics);
    updateSignalBanner(card,data);
    drawCharts(id,data,stock.indicators);
    drawTrades(card,data.metrics.trades);
    card.querySelector('.card-status').innerHTML=`<span style="color:var(--text3);">${new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})} 更新</span>`;
  }catch(e){
    card.querySelector('.card-status').innerHTML=`<span style="color:var(--red);">⚠ 連線失敗</span>`;
  }
}

function updateSignalBanner(card,data){
  const lastDiff=data.diff[data.diff.length-1];
  const hasBuy=data.buyPoints[data.buyPoints.length-1]!==null;
  const hasSell=data.sellPoints[data.sellPoints.length-1]!==null;
  let html='';
  if(hasBuy) html='<span class="signal-big buy">▲ 買進訊號！</span>';
  else if(hasSell) html='<span class="signal-big sell">▼ 賣出訊號！</span>';
  else if(lastDiff>0.1) html='<span class="signal-big buy" style="font-size:12px;">▲ 多頭趨勢 · 等待訊號</span>';
  else if(lastDiff<-0.1) html='<span class="signal-big sell" style="font-size:12px;">▼ 空頭趨勢 · 觀望</span>';
  else html='<span class="signal-big hold">— 中立 · 等待訊號</span>';
  card.querySelector('.signal-banner').innerHTML=html;
}

function setMetrics(card,m){
  [{k:'ret',fn:m=>(m.totalReturn>=0?'+':'')+m.totalReturn+'%',c:m=>m.totalReturn>=0?'up':'down'},
   {k:'cagr',fn:m=>(m.cagr>=0?'+':'')+m.cagr+'%',c:m=>m.cagr>=0?'up':'down'},
   {k:'pf',fn:m=>m.pf>=999?'∞':m.pf.toFixed(2),c:m=>m.pf>=1?'up':'down'},
   {k:'dd',fn:m=>m.maxDD+'%',c:()=>'down'},
   {k:'wr',fn:m=>m.wr+'%',c:m=>m.wr>=40?'up':'neutral'},
   {k:'tc',fn:m=>m.tradeCount+'筆',c:()=>'neutral'},
  ].forEach(d=>{
    const el=card.querySelector(`[data-m="${d.k}"]`);
    if(el){el.textContent=m?d.fn(m):'—';el.className='metric-val '+(m?d.c(m):'neutral');}
  });
}

function drawTrades(card,trades){
  const tbl=card.querySelector('.trades-list');
  if(!trades||!trades.length){tbl.innerHTML='<div style="color:var(--text2);padding:8px 0;text-align:center;font-size:12px;">此期間無交易紀錄</div>';return;}
  tbl.innerHTML=trades.map(t=>`
    <div class="tm-row">
      <span style="color:var(--green);">▲${t.buyPrice}</span>
      <span style="color:var(--text3);margin:0 4px;">→</span>
      <span style="color:var(--red);">▼${t.sellPrice}</span>
      <span class="${t.ret>=0?'up':'down'}" style="font-weight:600;margin-left:8px;">${t.ret>=0?'+':''}${t.ret}%</span>
      <div style="font-size:10px;color:var(--text3);margin-top:1px;">${t.buyDate||''} → ${t.sellDate||''}</div>
    </div>`).join('');
}

// ── Lightweight Charts 繪圖 ──────────────────────────────
function toTime(dateStr){
  if(dateStr.length>10) return Math.floor(new Date(dateStr).getTime()/1000);
  return dateStr;
}

function buildChartsInContainer(container,data,indicators,height){
  const charts=[];
  const prices=data.prices;
  const dates=data.dates;
  const diff=calcEMADiff(data.ema20,data.ema50);
  const {K,D}=calcKD(prices);
  const rsiVals=calcRSI(prices);

  // ── Tooltip 浮動框 ──
  const tooltip=document.createElement('div');
  tooltip.style.cssText='position:absolute;z-index:100;display:none;background:rgba(20,24,36,0.97);border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:8px 12px;font-size:11px;color:#e8eaf0;pointer-events:none;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.5);min-width:160px;';
  container.style.position='relative';
  container.appendChild(tooltip);

  // ── 主圖：K線 + EMA20/50 + 買賣點 ──
  const mainH=height||240;
  const mainDiv=document.createElement('div');
  mainDiv.style.cssText=`width:100%;height:${mainH}px;`;
  container.appendChild(mainDiv);

  const mainChart=LightweightCharts.createChart(mainDiv,{...CHART_OPTS,height:mainH});
  const lineSeries=mainChart.addLineSeries({color:'#378ADD',lineWidth:2,priceLineVisible:false,lastValueVisible:false});
  lineSeries.setData(dates.map((d,i)=>({time:toTime(d),value:prices[i]})));

  const ema20Series=mainChart.addLineSeries({color:'#26a69a',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
  ema20Series.setData(dates.map((d,i)=>data.ema20[i]!=null?{time:toTime(d),value:data.ema20[i]}:null).filter(Boolean));

  const ema50Series=mainChart.addLineSeries({color:'#ef5350',lineWidth:1,lineStyle:1,priceLineVisible:false,lastValueVisible:false});
  ema50Series.setData(dates.map((d,i)=>data.ema50[i]!=null?{time:toTime(d),value:data.ema50[i]}:null).filter(Boolean));

  // 買進賣出標記
  const markers=[];
  dates.forEach((d,i)=>{
    if(data.buyPoints[i]!==null) markers.push({time:toTime(d),position:'belowBar',color:'#26a69a',shape:'arrowUp',text:'買',size:1});
    if(data.sellPoints[i]!==null) markers.push({time:toTime(d),position:'aboveBar',color:'#ef5350',shape:'arrowDown',text:'賣',size:1});
  });
  lineSeries.setMarkers(markers);
  charts.push(mainChart);

  // ── Crosshair 事件：顯示 tooltip ──
  mainChart.subscribeCrosshairMove(param=>{
    if(!param||!param.point||param.point.x<0){tooltip.style.display='none';return;}
    const idx=param.logical!=null?Math.round(param.logical):null;
    if(idx==null||idx<0||idx>=dates.length){tooltip.style.display='none';return;}
    const price=prices[idx];
    const e20=data.ema20[idx];
    const e50=data.ema50[idx];
    const hasBuy=data.buyPoints[idx]!==null;
    const hasSell=data.sellPoints[idx]!==null;
    const k=K[idx],d_=D[idx],rsi=rsiVals[idx],df=diff[idx];
    let html=`<div style="color:#8b90a0;margin-bottom:5px;font-size:10px;">${dates[idx]}</div>`;
    html+=`<div style="display:flex;justify-content:space-between;gap:14px;line-height:1.9;">`;
    html+=`<span style="color:#8b90a0;">收盤</span><span style="color:#378ADD;font-weight:500;">${price}</span></div>`;
    if(e20!=null) html+=`<div style="display:flex;justify-content:space-between;gap:14px;line-height:1.9;"><span style="color:#8b90a0;">EMA20</span><span style="color:#26a69a;font-weight:500;">${e20}</span></div>`;
    if(e50!=null) html+=`<div style="display:flex;justify-content:space-between;gap:14px;line-height:1.9;"><span style="color:#8b90a0;">EMA50</span><span style="color:#ef5350;font-weight:500;">${e50}</span></div>`;
    if(indicators.ema) html+=`<div style="display:flex;justify-content:space-between;gap:14px;line-height:1.9;"><span style="color:#8b90a0;">EMA差距</span><span style="color:${df>=0?"#26a69a":"#ef5350"};font-weight:500;">${df>0?"+":""}${df}%</span></div>`;
    if(indicators.kd&&k!=null) html+=`<div style="display:flex;justify-content:space-between;gap:14px;line-height:1.9;"><span style="color:#8b90a0;">K/D</span><span style="font-weight:500;"><span style="color:#f5a623;">${k}</span> / <span style="color:#378ADD;">${d_}</span></span></div>`;
    if(indicators.rsi&&rsi!=null) html+=`<div style="display:flex;justify-content:space-between;gap:14px;line-height:1.9;"><span style="color:#8b90a0;">RSI</span><span style="color:#9c27b0;font-weight:500;">${rsi}</span></div>`;
    if(hasBuy) html+=`<div style="color:#26a69a;font-weight:700;margin-top:3px;">▲ 買進訊號</div>`;
    if(hasSell) html+=`<div style="color:#ef5350;font-weight:700;margin-top:3px;">▼ 賣出訊號</div>`;
    tooltip.innerHTML=html;
    // 計算位置
    const containerRect=container.getBoundingClientRect();
    const mainRect=mainDiv.getBoundingClientRect();
    let left=param.point.x+15;
    if(left+180>mainRect.width) left=param.point.x-195;
    tooltip.style.left=left+'px';
    tooltip.style.top='10px';
    tooltip.style.display='block';
  });
  mainDiv.addEventListener('mouseleave',()=>{tooltip.style.display='none';});

  // ── EMA差距 ──
  if(indicators.ema){
    const diff=calcEMADiff(data.ema20,data.ema50);
    const emaDiv=document.createElement('div');
    emaDiv.style.width='100%';emaDiv.style.height='60px';
    const label=document.createElement('div');
    label.className='chart-pane-label';label.textContent='EMA差距';
    container.appendChild(label);container.appendChild(emaDiv);
    const emaChart=LightweightCharts.createChart(emaDiv,{...CHART_OPTS,height:60,
      timeScale:{visible:false},rightPriceScale:{scaleMargins:{top:0.1,bottom:0.1}}});
    const emaHist=emaChart.addHistogramSeries({priceLineVisible:false,lastValueVisible:false});
    emaHist.setData(dates.map((d,i)=>({time:toTime(d),value:diff[i],color:diff[i]>=0?'rgba(38,166,154,0.6)':'rgba(239,83,80,0.6)'})));
    charts.push(emaChart);
    mainChart.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r)emaChart.timeScale().setVisibleLogicalRange(r);});
    emaChart.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r)mainChart.timeScale().setVisibleLogicalRange(r);});
  }

  // ── KD 線 ──
  if(indicators.kd){
    const {K,D}=calcKD(prices);
    const kdDiv=document.createElement('div');
    kdDiv.style.width='100%';kdDiv.style.height='70px';
    const label=document.createElement('div');
    label.className='chart-pane-label';label.textContent='KD';
    container.appendChild(label);container.appendChild(kdDiv);
    const kdChart=LightweightCharts.createChart(kdDiv,{...CHART_OPTS,height:70,
      timeScale:{visible:false},rightPriceScale:{scaleMargins:{top:0.1,bottom:0.1}}});
    const kLine=kdChart.addLineSeries({color:'#f5a623',lineWidth:1.2,priceLineVisible:false,lastValueVisible:true,title:'K'});
    const dLine=kdChart.addLineSeries({color:'#378ADD',lineWidth:1.2,priceLineVisible:false,lastValueVisible:true,title:'D'});
    kLine.setData(dates.map((d,i)=>({time:toTime(d),value:K[i]})));
    dLine.setData(dates.map((d,i)=>({time:toTime(d),value:D[i]})));
    charts.push(kdChart);
    mainChart.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r)kdChart.timeScale().setVisibleLogicalRange(r);});
    kdChart.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r)mainChart.timeScale().setVisibleLogicalRange(r);});
  }

  // ── RSI ──
  if(indicators.rsi){
    const rsi=calcRSI(prices);
    const rsiDiv=document.createElement('div');
    rsiDiv.style.width='100%';rsiDiv.style.height='70px';
    const label=document.createElement('div');
    label.className='chart-pane-label';label.textContent='RSI(14)';
    container.appendChild(label);container.appendChild(rsiDiv);
    const rsiChart=LightweightCharts.createChart(rsiDiv,{...CHART_OPTS,height:70,
      timeScale:{visible:false},rightPriceScale:{scaleMargins:{top:0.1,bottom:0.1}}});
    const rsiLine=rsiChart.addLineSeries({color:'#9c27b0',lineWidth:1.2,priceLineVisible:false,lastValueVisible:true,title:'RSI'});
    rsiLine.setData(dates.map((d,i)=>rsi[i]!=null?{time:toTime(d),value:rsi[i]}:null).filter(Boolean));
    charts.push(rsiChart);
    mainChart.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r)rsiChart.timeScale().setVisibleLogicalRange(r);});
    rsiChart.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r)mainChart.timeScale().setVisibleLogicalRange(r);});
  }

  // ── 成交量 ──
  if(indicators.vol&&data.volumes&&data.volumes.some(v=>v>0)){
    const volDiv=document.createElement('div');
    volDiv.style.width='100%';volDiv.style.height='50px';
    const label=document.createElement('div');
    label.className='chart-pane-label';label.textContent='成交量';
    container.appendChild(label);container.appendChild(volDiv);
    const volChart=LightweightCharts.createChart(volDiv,{...CHART_OPTS,height:50,
      timeScale:{visible:true},rightPriceScale:{scaleMargins:{top:0.1,bottom:0}}});
    const volHist=volChart.addHistogramSeries({priceLineVisible:false,lastValueVisible:false});
    volHist.setData(dates.map((d,i)=>({
      time:toTime(d),value:data.volumes[i]||0,
      color:i===0?'rgba(55,138,221,0.5)':prices[i]>=prices[i-1]?'rgba(38,166,154,0.5)':'rgba(239,83,80,0.5)'
    })));
    charts.push(volChart);
    mainChart.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r)volChart.timeScale().setVisibleLogicalRange(r);});
    volChart.timeScale().subscribeVisibleLogicalRangeChange(r=>{if(r)mainChart.timeScale().setVisibleLogicalRange(r);});
  }

  // 同步所有圖表的時間軸
  mainChart.timeScale().fitContent();
  return charts;
}

function drawCharts(id,data,indicators){
  destroyCard(id);
  const card=document.getElementById(`card-${id}`);
  const container=card.querySelector('.chart-container');
  container.innerHTML='';
  chartInsts[id]=buildChartsInContainer(container,data,indicators,220);
}

// ── Modal ──────────────────────────────────────────────
function openModal(id){
  const card=document.getElementById(`card-${id}`);
  if(!card||card.dataset.loaded!=='1') return;
  const stock=stocks.find(s=>s.id===id);
  modalStockId=id;
  modalData=JSON.parse(card.dataset.chartdata||'null');
  modalIndicators={...stock.indicators};
  document.getElementById('modalTitle').textContent=`${stock?.name||stock?.symbol} — 放大圖`;
  document.getElementById('modalPeriod').value=stock?.period||'2y';
  document.getElementById('modalTf').value=stock?.tf||'1d';

  // 建立指標開關
  const togglesEl=document.getElementById('modalIndToggles');
  togglesEl.innerHTML=[
    {k:'ema',l:'EMA差距'},{k:'kd',l:'KD 線'},{k:'rsi',l:'RSI'},{k:'vol',l:'成交量'}
  ].map(o=>`<button id="modal-itoggle-${o.k}" class="itoggle ${modalIndicators[o.k]?'on':''}" onclick="toggleModalIndicator('${o.k}')">${o.l}</button>`).join('');

  // 更新訊號
  updateModalSignal(modalData);
  document.getElementById('modalBg').classList.add('open');
  drawModalCharts(modalData,modalIndicators);
}

function updateModalSignal(data){
  if(!data) return;
  const lastDiff=data.diff[data.diff.length-1];
  const hasBuy=data.buyPoints[data.buyPoints.length-1]!==null;
  const hasSell=data.sellPoints[data.sellPoints.length-1]!==null;
  let html='';
  if(hasBuy) html='<span style="color:#26a69a;">▲ 現在有買進訊號！</span>';
  else if(hasSell) html='<span style="color:#ef5350;">▼ 現在有賣出訊號！</span>';
  else if(lastDiff>0.1) html='<span style="color:#26a69a;">▲ 多頭趨勢 · 等待訊號</span>';
  else if(lastDiff<-0.1) html='<span style="color:#ef5350;">▼ 空頭趨勢 · 觀望</span>';
  else html='<span style="color:#8b90a0;">— 中立 · 等待訊號</span>';
  document.getElementById('modalSignal').innerHTML=html;
}

async function reloadModal(){
  if(!modalStockId) return;
  const stock=stocks.find(s=>s.id===modalStockId);
  if(!stock) return;
  const p=document.getElementById('modalPeriod').value;
  const tf=document.getElementById('modalTf').value;
  try{
    const r=await fetch(`/api/analyze?symbol=${stock.symbol}&strategy=${stock.strat}&period=${p}&timeframe=${tf}`);
    const data=await r.json();
    if(!data.error){modalData=data;updateModalSignal(data);drawModalCharts(data,modalIndicators);}
  }catch(e){}
}

function drawModalCharts(data,indicators){
  if(!data) return;
  if(modalChartInst){
    modalChartInst.forEach(c=>{try{c.remove();}catch(e){}});
    modalChartInst=null;
  }
  const container=document.getElementById('modalChartContainer');
  container.innerHTML='';
  modalChartInst=buildChartsInContainer(container,data,indicators,360);
}

function closeModal(e){
  if(e&&e.target!==document.getElementById('modalBg')) return;
  document.getElementById('modalBg').classList.remove('open');
}
document.addEventListener('keydown',e=>{if(e.key==='Escape') document.getElementById('modalBg').classList.remove('open');});

// ── 渲染卡片 ──────────────────────────────────────────
function renderCard(stock){
  const div=document.createElement('div');
  div.className='card';div.id=`card-${stock.id}`;div.dataset.loaded='0';
  const periodOpts=PERIODS.map(p=>`<option value="${p}" ${p===(stock.period||'2y')?'selected':''}>${PERIOD_LABELS[p]}</option>`).join('');
  const tfOpts=TFS.map(t=>`<option value="${t}" ${t===(stock.tf||'1d')?'selected':''}>${TF_LABELS[t]}</option>`).join('');
  const stratOpts=strategies.map(s=>`<option value="${s.v}" ${s.v===stock.strat?'selected':''}>${s.l}</option>`).join('');
  const inds=stock.indicators||{ema:true,kd:true,rsi:true,vol:true};
  const indToggles=[
    {k:'ema',l:'EMA差距'},{k:'kd',l:'KD 線'},{k:'rsi',l:'RSI'},{k:'vol',l:'成交量'}
  ].map(o=>`<button id="itoggle-${stock.id}-${o.k}" class="itoggle ${inds[o.k]?'on':''}" onclick="toggleIndicator(${stock.id},'${o.k}')">${o.l}</button>`).join('');

  div.innerHTML=`
    <div class="card-top">
      <div>
        <div class="card-name">${stock.name||stock.symbol}</div>
        <div class="card-sub">${stock.symbol} · ${getStratName(stock.strat)} · ${TF_LABELS[stock.tf]||'1d'}</div>
      </div>
      <div class="card-actions">
        <button class="btn-icon" onclick="openModal(${stock.id})" title="放大">⛶</button>
        <button class="btn-icon" onclick="reloadCard(${stock.id})" title="重新載入">↺</button>
        <button class="btn-icon del" onclick="deleteStock(${stock.id},event)" title="刪除">✕</button>
      </div>
    </div>
    <div class="signal-banner"><span class="signal-big hold">— 等待載入</span></div>
    <div class="metrics">
      <div class="metric"><div class="metric-label">總報酬</div><div class="metric-val neutral" data-m="ret">—</div></div>
      <div class="metric"><div class="metric-label">年化</div><div class="metric-val neutral" data-m="cagr">—</div></div>
      <div class="metric"><div class="metric-label">PF</div><div class="metric-val neutral" data-m="pf">—</div></div>
      <div class="metric"><div class="metric-label">回撤</div><div class="metric-val neutral" data-m="dd">—</div></div>
      <div class="metric"><div class="metric-label">勝率</div><div class="metric-val neutral" data-m="wr">—</div></div>
      <div class="metric"><div class="metric-label">交易</div><div class="metric-val neutral" data-m="tc">—</div></div>
    </div>
    <div class="card-status"><span style="color:var(--text2);">等待載入...</span></div>
    <div class="chart-section">
      <div class="toolbar">
        <select class="sel-sm" onchange="changeStrat(${stock.id},this.value)">${stratOpts}</select>
        <select class="sel-sm" onchange="changePeriod(${stock.id},this.value)">${periodOpts}</select>
        <select class="sel-sm" onchange="changeTf(${stock.id},this.value)">${tfOpts}</select>
      </div>
      <div class="ind-toggles">${indToggles}</div>
      <div class="chart-container"></div>
      <div class="trades-section">
        <div class="trades-title">最近進出場</div>
        <div class="trades-list"></div>
      </div>
    </div>
  `;
  document.getElementById('grid').appendChild(div);
}

async function init(){
  await loadStrategies();
  stocks.forEach(s=>renderCard(s));
  stocks.forEach(s=>loadCard(s.id));
}
init();
</script>
